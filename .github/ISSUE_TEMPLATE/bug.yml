name: 出问题了 / Bug
description: 技能做错了、报错了，或者结果和预期不一样
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 你看到了什么，原本以为会是什么。
      placeholder: 例：杯子已经满了，屏幕上却说"等太久"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 当时在做什么
      description: 你对 AI 说了什么、点了什么，按顺序写。记不清就写个大概。
    validations:
      required: false
  - type: dropdown
    id: where
    attributes:
      label: 出在哪一步
      options:
        - 生成配方
        - 研磨换算（C40 等）
        - 连蓝牙 / 体检
        - 装载配方（不出水）
        - 真机冲煮
        - 冲完后的记录或建议
        - 不确定
    validations:
      required: true
  - type: dropdown
    id: brewer
    attributes:
      label: 用的哪个滤杯
      options:
        - Omni（原装）
        - V60 01
        - 其他滤杯（在下面写是什么）
    validations:
      required: false
  - type: dropdown
    id: agent
    attributes:
      label: 用的哪个 AI
      options:
        - WorkBuddy
        - Claude Code
        - Codex
        - Cursor
        - 其他
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: 技能版本
      description: 不知道就留空。在技能目录的 SKILL.md 开头 version 那一行。
      placeholder: 例：1.3.3
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: 截图或记录
      description: 报错截图、AI 的回复；真机问题可以贴 runs/ 里对应那次的记录文件。
    validations:
      required: false
